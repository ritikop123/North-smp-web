<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="chestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="purpleKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="goldKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="keyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Halo -->
  <circle cx="120" cy="120" r="85" fill="#9333EA" opacity="0.18" filter="url(#keyGlow)"/>

  <!-- Isometric Mystery Chest / Crate -->
  <g transform="translate(100, 130)">
    <!-- Chest Base -->
    <polygon points="-55,-10 0,-35 55,-10 0,15" fill="#38BDF8" stroke="#0284C7" stroke-width="2"/>
    <!-- Left side -->
    <polygon points="-55,-10 0,15 0,65 -55,40" fill="#0369A1" stroke="#0284C7" stroke-width="1.5"/>
    <!-- Right side -->
    <polygon points="0,15 55,-10 55,40 0,65" fill="#0C4A6E" stroke="#0284C7" stroke-width="1.5"/>
    <!-- Iron bands -->
    <polygon points="-28,2 -28,52 0,65 0,15" fill="#0284C7" opacity="0.3"/>
    <polygon points="28,-3 28,47 0,65 0,15" fill="#0284C7" opacity="0.3"/>
    <!-- Lock -->
    <rect x="-8" y="22" width="16" height="20" rx="3" fill="#FBBF24" stroke="#78350F" stroke-width="1.5"/>
    <circle cx="0" cy="30" r="2.5" fill="#78350F"/>
  </g>

  <!-- Floating Mystic Crate Key -->
  <g transform="translate(140, 75) rotate(-30)">
    <!-- Glow -->
    <g filter="url(#keyGlow)">
      <!-- Key Ring Head -->
      <circle cx="0" cy="-35" r="22" fill="none" stroke="url(#purpleKey)" stroke-width="8"/>
      <!-- Inner star in ring -->
      <polygon points="0,-43 3,-37 9,-35 3,-33 0,-27 -3,-33 -9,-35 -3,-37" fill="#FDF4FF"/>
      <!-- Key Shaft -->
      <rect x="-4" y="-15" width="8" height="60" rx="3" fill="url(#purpleKey)"/>
      <!-- Key Teeth / Bits -->
      <rect x="4" y="20" width="16" height="6" rx="2" fill="url(#purpleKey)"/>
      <rect x="4" y="34" width="22" height="6" rx="2" fill="url(#purpleKey)"/>
      <!-- Magical sparkle particles -->
      <circle cx="-16" cy="-10" r="3" fill="#FFFFFF"/>
      <circle cx="20" cy="-20" r="2.5" fill="#E879F9"/>
      <circle cx="-12" cy="30" r="2" fill="#38BDF8"/>
    </g>
  </g>
</svg>


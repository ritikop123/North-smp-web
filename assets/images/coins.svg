<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="40%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <filter id="gemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Halo -->
  <circle cx="120" cy="120" r="85" fill="#06B6D4" opacity="0.15" filter="url(#gemGlow)"/>

  <!-- Isometric Coins Stack -->
  <g transform="translate(100, 140)">
    <!-- Bottom Coin -->
    <ellipse cx="0" cy="20" rx="45" ry="18" fill="#78350F" />
    <path d="M -45 10 A 45 18 0 0 0 45 10 L 45 20 A 45 18 0 0 1 -45 20 Z" fill="#B45309"/>
    <ellipse cx="0" cy="10" rx="45" ry="18" fill="url(#coinGrad)" stroke="#FDE68A" stroke-width="2"/>

    <!-- Middle Coin -->
    <path d="M -45 -5 A 45 18 0 0 0 45 -5 L 45 5 A 45 18 0 0 1 -45 5 Z" fill="#B45309"/>
    <ellipse cx="0" cy="-5" rx="45" ry="18" fill="url(#coinGrad)" stroke="#FDE68A" stroke-width="2"/>
    <ellipse cx="0" cy="-5" rx="34" ry="13" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>

  <!-- Giant Glowing Emerald / Diamond Gem on top -->
  <g transform="translate(135, 75)">
    <!-- Outer Glow -->
    <polygon points="0,-45 42,-15 42,25 0,55 -42,25 -42,-15" 
             fill="url(#gemGrad)" stroke="#A5F3FC" stroke-width="3" filter="url(#gemGlow)"/>
    <!-- Facets -->
    <polygon points="0,-45 0,55 42,25" fill="#0891B2" opacity="0.4"/>
    <polygon points="0,-45 -42,-15 0,0" fill="#A5F3FC" opacity="0.6"/>
    <polygon points="0,-45 42,-15 0,0" fill="#22D3EE" opacity="0.5"/>
    <polygon points="-42,-15 -42,25 0,0" fill="#0891B2" opacity="0.3"/>
    <polygon points="42,-15 42,25 0,0" fill="#0E7490" opacity="0.6"/>
    <polygon points="-42,25 0,55 0,0" fill="#155E75" opacity="0.7"/>
    <polygon points="42,25 0,55 0,0" fill="#083344" opacity="0.8"/>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="500" height="140">
  <defs>
    <linearGradient id="northGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem: North Compass Shield -->
  <g transform="translate(20, 10)">
    <!-- Outer Glow -->
    <path d="M 60 10 L 105 32 L 105 85 L 60 115 L 15 85 L 15 32 Z" 
          fill="none" stroke="#00D2FF" stroke-width="3" opacity="0.4" filter="url(#glow)"/>
    <!-- Shield Background -->
    <path d="M 60 12 L 102 34 L 102 83 L 60 112 L 18 83 L 18 34 Z" 
          fill="url(#shieldGrad)" stroke="#00D2FF" stroke-width="2.5"/>
    
    <!-- Inner faceted details -->
    <path d="M 60 12 L 60 112 L 18 83 L 18 34 Z" fill="#00D2FF" opacity="0.08"/>
    
    <!-- North Star / Compass -->
    <g transform="translate(60, 62)">
      <!-- 4-point star -->
      <polygon points="0,-36 8,-9 36,0 8,9 0,36 -8,9 -36,0 -8,-9" 
               fill="url(#northGrad)" filter="url(#starGlow)"/>
      <polygon points="0,-24 5,-6 24,0 5,6 0,24 -5,6 -24,0 -5,-6" 
               fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="4" fill="#0284C7"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(145, 20)">
    <!-- NORTH Text Shadow / Glow -->
    <text x="0" y="62" 
          font-family="'Poppins', 'Montserrat', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="64" 
          letter-spacing="4" 
          fill="#00D2FF" 
          opacity="0.3" 
          filter="url(#glow)">NORTH</text>
          
    <!-- NORTH Text Main -->
    <text x="0" y="62" 
          font-family="'Poppins', 'Montserrat', 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="64" 
          letter-spacing="4" 
          fill="#FFFFFF">NORTH</text>

    <!-- SMP Badge -->
    <g transform="translate(245, 14)">
      <rect x="0" y="0" width="84" height="34" rx="8" 
            fill="url(#accentGrad)" />
      <rect x="1.5" y="1.5" width="81" height="31" rx="6.5" 
            fill="#0F172A" />
      <text x="42" y="24" 
            text-anchor="middle"
            font-family="'Poppins', sans-serif" 
            font-weight="800" 
            font-size="20" 
            letter-spacing="2" 
            fill="url(#northGrad)">SMP</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="4" y="94" 
          font-family="'Poppins', sans-serif" 
          font-weight="600" 
          font-size="13" 
          letter-spacing="4" 
          fill="#94A3B8">OFFICIAL NETWORK STORE</text>

    <!-- Modern glowing underline bar -->
    <rect x="4" y="103" width="310" height="3" rx="1.5" fill="#1E293B" />
    <rect x="4" y="103" width="110" height="3" rx="1.5" fill="url(#northGrad)" />
  </g>
</svg>


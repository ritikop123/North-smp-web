<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="crownGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Halo -->
  <circle cx="120" cy="120" r="85" fill="#0284C7" opacity="0.15" filter="url(#crownGlow)"/>

  <!-- Crown Base & Spikes -->
  <g transform="translate(120, 120)">
    <!-- Crown Body -->
    <path d="M -70 20 L -80 -40 L -35 -10 L 0 -55 L 35 -10 L 80 -40 L 70 20 Z" 
          fill="url(#goldGrad)" stroke="#FEF08A" stroke-width="3" filter="url(#crownGlow)"/>
    
    <!-- Crown Rim Band -->
    <rect x="-70" y="20" width="140" height="24" rx="4" fill="#A16207" stroke="#FEF08A" stroke-width="2"/>
    
    <!-- Gems on Spikes -->
    <circle cx="-80" cy="-40" r="7" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="0" cy="-55" r="9" fill="#00D2FF" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="80" cy="-40" r="7" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Gems on Band -->
    <rect x="-50" y="26" width="12" height="12" rx="2" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(45, -44, 32)"/>
    <rect x="-6" y="26" width="12" height="12" rx="2" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(45, 0, 32)"/>
    <rect x="38" y="26" width="12" height="12" rx="2" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" transform="rotate(45, 44, 32)"/>

    <!-- Highlights -->
    <polygon points="0,-48 10,-12 0,16 -10,-12" fill="#FFFFFF" opacity="0.3"/>
  </g>
</svg>

